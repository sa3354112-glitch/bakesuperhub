<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bake Super Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff}
.header{padding:12px;display:flex;justify-content:space-between;align-items:center;background:#0a0a0a;border-bottom:1px solid #222;position:sticky;top:0;z-index:99}
.logo{display:flex;gap:8px;align-items:center}
.logo img{width:40px;height:40px;border-radius:50%;border:2px solid orange;background:#fff}
.cart{background:#1a1a1a;padding:8px 12px;border-radius:10px}
.search{margin:12px;background:#1a1a1a;border:1px solid #222;border-radius:10px;padding:10px 12px;display:flex;gap:8px}
.search input{flex:1;background:transparent;border:0;color:#fff;outline:none}
.hero{margin:12px;border-radius:16px;height:200px;position:relative;overflow:hidden;background:#000}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-text{position:absolute;inset:0;background:linear-gradient(0deg,#000 20%,transparent 80%);padding:16px;display:flex;flex-direction:column;justify-content:flex-end}
.list{padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:#151515;border-radius:12px;overflow:hidden;border:1px solid #222}
.card img{width:100%;height:140px;object-fit:cover;background:#111}
.card-body{padding:10px;display:flex;justify-content:space-between;align-items:center}
.price{color:orange;font-weight:800}
button{border:0;padding:8px 14px;border-radius:20px;font-weight:800;background:orange;color:#000}
#cartBox{position:fixed;bottom:-100%;left:0;right:0;background:#151515;padding:16px;border-radius:16px 16px 0 0;transition:.3s;z-index:200;max-height:70vh;overflow:auto}
#cartBox.open{bottom:0}
#over{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:199}
#over.open{display:block}
.admin{position:fixed;inset:0;background:#0a0a0a;z-index:500;display:none;padding:14px;overflow:auto}
.admin.open{display:block}
</style>
</head>
<body>
<div class="header">
<div class="logo" id="logoBtn"><img src="logo.png" onerror="this.style.display='none'"><b style="color:orange">Bake Super Hub</b></div>
<div class="cart" onclick="toggleCart()">🛒 <span id="count">0</span></div>
</div>

<div class="search"><span>🔍</span><input id="search" placeholder="Search burger, pizza..." oninput="doSearch()"></div>

<div id="home">
<div class="hero">
<img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600">
<div class="hero-text"><b style="font-size:20px">Bake Super Hub</b><span style="font-size:13px">Nagina's #1 Food Delivery - 30 min</span></div>
</div>
<div style="margin:0 12px;background:#111;border:1px solid #222;border-radius:8px;padding:8px;text-align:center;font-size:11px;color:#aaa">Free: 3 Burger • 2 Pizza • 1 Pizza (3-4km) • 0-3km • 1B Rs30</div>
<div class="list" id="list"></div>
</div>

<div id="orderPage" style="display:none;padding:14px">
<h3>Delivery Details</h3>
<input id="name" placeholder="Full Name *" style="width:100%;padding:12px;background:#1e1e1e;border:1px solid #333;border-radius:10px;color:#fff;margin:8px 0">
<input id="phone" placeholder="Phone 10 digit *" maxlength="10" style="width:100%;padding:12px;background:#1e1e1e;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:8px">
<textarea id="addr" placeholder="Address *" style="width:100%;padding:12px;background:#1e1e1e;border:1px solid #333;border-radius:10px;color:#fff"></textarea>
<button onclick="placeOrder()" style="width:100%;margin-top:12px;padding:12px">Confirm Order</button>
<button onclick="showHome()" style="width:100%;margin-top:8px;background:#222;color:#fff;border:1px solid #333;padding:12px;border-radius:10px">Back</button>
</div>

<div id="donePage" style="display:none;padding:14px;text-align:center">
<div style="width:60px;height:60px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:28px">✓</div>
<h2 style="margin-top:12px">Order Confirmed</h2>
<p id="oid" style="color:#888"></p>
<p id="odetails" style="white-space:pre-line;text-align:left;background:#1a1a1a;padding:12px;border-radius:12px;margin-top:12px;font-size:13px"></p>
<a id="omap" href="#" target="_blank" style="display:inline-block;margin-top:12px;background:#25D366;color:#fff;padding:10px 18px;border-radius:20px;text-decoration:none">View Location</a>
<br><br>
<button onclick="showHome()" style="background:#222;color:#fff;border:1px solid #333;padding:12px 20px;border-radius:10px">Continue Ordering</button>
</div>

<div id="cartBox">
<div style="display:flex;justify-content:space-between"><h3>Cart</h3><span onclick="toggleCart()" style="font-size:22px">✕</span></div>
<div id="cartItems" style="margin-top:12px"></div>
<div style="margin-top:12px;border-top:1px dashed #333;padding-top:10px">
<div style="display:flex;justify-content:space-between;color:#aaa;font-size:12px"><span>Subtotal</span><span>Rs <span id="sub">0</span></span></div>
<div style="display:flex;justify-content:space-between;color:#aaa;font-size:12px"><span>Delivery</span><span>Rs <span id="del">0</span></span></div>
<div style="display:flex;justify-content:space-between;font-weight:800;margin-top:6px"><span>Total</span><span>Rs <span id="tot">0</span></span></div>
</div>
<button onclick="goCheckout()" style="width:100%;margin-top:12px;padding:12px">Checkout</button>
</div>
<div id="over" onclick="toggleCart()"></div>

<div class="admin" id="admin">
<div style="display:flex;justify-content:space-between"><h2 style="color:orange">Admin</h2><button onclick="closeAdmin()" style="background:#222;color:#fff;padding:8px 14px;border-radius:8px">X</button></div>
<div id="adminOrders" style="margin-top:12px"></div>
</div>

<script>
var products=[
{id:1,name:"Nagina Special Burger",price:39,img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600"},
{id:2,name:"Cheese Burger",price:49,img:"https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=600"},
{id:3,name:"Veg Grill Sandwich",price:49,img:"https://images.unsplash.com/photo-1521390188846-e2a3a97453a0?w=600"},
{id:4,name:"Veg Cheese Pizza",price:120,img:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600"},
{id:5,name:"Cheese Corn Pizza",price:149,img:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600"}
];
var cart=[],orders=JSON.parse(localStorage.getItem('orders')||'[]'),taps=0,last=0;

function render(){
var html='';
for(var i=0;i<products.length;i++){
var p=products[i];
var q=0;
for(var j=0;j<cart.length;j++) if(cart[j].id==p.id) q=cart[j].qty;
html+='<div class="card"><img src="'+p.img+'"><div class="card-body"><div><b style="font-size:14px">'+p.name+'</b><br><span style="color:orange">Rs '+p.price+'</span></div>';
if(q==0) html+='<button onclick="add('+p.id+')">Add</button>';
else html+='<div style="display:flex;gap:8px;align-items:center"><button onclick="chg('+p.id+',-1)">-</button><b>'+q+'</b><button onclick="chg('+p.id+',1)">+</button></div>';
html+='</div></div>';
}
document.getElementById('list').innerHTML=html;
updateCart();
}

function doSearch(){
var q=document.getElementById('search').value.toLowerCase();
if(!q){render();return;}
var f=[];
for(var i=0;i<products.length;i++) if(products[i].name.toLowerCase().indexOf(q)>-1) f.push(products[i]);
var html='';
for(var i=0;i<f.length;i++){
var p=f[i];
html+='<div class="card"><img src="'+p.img+'"><div class="card-body"><div><b>'+p.name+'</b><br><span style="color:orange">Rs '+p.price+'</span></div><button onclick="add('+p.id+')">Add</button></div></div>';
}
document.getElementById('list').innerHTML=html||'<div style="text-align:center;padding:20px;color:#666">Not found</div>';
}

function add(id){
var p=null;
for(var i=0;i<products.length;i++) if(products[i].id==id) p=products[i];
var found=false;
for(var j=0;j<cart.length;j++) if(cart[j].id==id){cart[j].qty++;found=true;}
if(!found) cart.push({id:p.id,name:p.name,price:p.price,qty:1});
render();
}

function chg(id,d){
for(var i=0;i<cart.length;i++) if(cart[i].id==id){cart[i].qty+=d;if(cart[i].qty<=0) cart.splice(i,1);break;}
render();
}

function updateCart(){
var q=0,s=0;
for(var i=0;i<cart.length;i++){q+=cart[i].qty;s+=cart[i].price*cart[i].qty;}
document.getElementById('count').innerText=q;
var b=0,p=0;
for(var i=0;i<cart.length;i++){if(cart[i].name.toLowerCase().indexOf('burger')>-1)b+=cart[i].qty;if(cart[i].name.toLowerCase().indexOf('pizza')>-1)p+=cart[i].qty;}
var del=0;
if(q==0) del=0;
else if(b>=3||p>=2) del=0;
else if(p>=1) del=0;
else del=30;
document.getElementById('sub').innerText=s;
document.getElementById('del').innerText=del;
document.getElementById('tot').innerText=s+del;
var h='';
for(var i=0;i<cart.length;i++) h+='<div style="display:flex;justify-content:space-between;background:#222;padding:8px;border-radius:8px;margin-bottom:6px"><span>'+cart[i].name+' x'+cart[i].qty+'</span><span>Rs'+cart[i].price*cart[i].qty+'</span></div>';
document.getElementById('cartItems').innerHTML=h||'Cart empty';
}

function toggleCart(){
var b=document.getElementById('cartBox');
var o=document.getElementById('over');
if(b.classList.contains('open')){b.classList.remove('open');o.classList.remove('open');}
else{b.classList.add('open');o.classList.add('open');}
}

function goCheckout(){
if(cart.length==0){alert('Cart empty');return;}
toggleCart();
document.getElementById('home').style.display='none';
document.getElementById('orderPage').style.display='block';
}

function showHome(){
document.getElementById('home').style.display='block';
document.getElementById('orderPage').style.display='none';
document.getElementById('donePage').style.display='none';
render();
}

function placeOrder(){
var n=document.getElementById('name').value.trim();
var ph=document.getElementById('phone').value.trim();
var a=document.getElementById('addr').value.trim();
if(!n||ph.length!=10||!a){alert('Fill all details');return;}
var s=0;
for(var i=0;i<cart.length;i++) s+=cart[i].price*cart[i].qty;
var b=0,p=0;
for(var i=0;i<cart.length;i++){if(cart[i].name.toLowerCase().indexOf('burger')>-1)b+=cart[i].qty;if(cart[i].name.toLowerCase().indexOf('pizza')>-1)p+=cart[i].qty;}
var del=0;
if(b>=3||p>=2) del=0;
else if(p>=1) del=0;
else del=30;
var tot=s+del;
var id='BSH'+Math.floor(1000+Math.random()*9000);
var items='';
for(var i=0;i<cart.length;i++) items+=cart[i].name+' x'+cart[i].qty+', ';
var that=this;
navigator.geolocation.getCurrentPosition(function(pos){
var lat=pos.coords.latitude.toFixed(6)+','+pos.coords.longitude.toFixed(6);
var map='https://www.google.com/maps?q='+pos.coords.latitude+','+pos.coords.longitude;
saveOrder(id,items,s,del,tot,n,ph,a,lat,map);
},function(){
saveOrder(id,items,s,del,tot,n,ph,a,'Not shared','https://maps.google.com/?q=29.4425,78.4365');
});
}

function saveOrder(id,items,s,del,tot,n,ph,a,lat,map){
orders.unshift({id:id,items:items,total:tot,name:n,phone:ph,addr:a,lat:lat,map:map,time:new Date().toLocaleString()});
localStorage.setItem('orders',JSON.stringify(orders));
cart=[];
render();
document.getElementById('orderPage').style.display='none';
document.getElementById('donePage').style.display='block';
document.getElementById('oid').innerText='#'+id;
document.getElementById('odetails').innerText='Name: '+n+'\nPhone: '+ph+'\nAddress: '+a+'\n\n'+items+'\nSubtotal Rs'+s+'\nDelivery Rs'+del+'\nTotal Rs'+tot+'\n\nLocation: '+lat;
document.getElementById('omap').href=map;
renderAdmin();
}

function renderAdmin(){
var h='';
for(var i=0;i<orders.length;i++){
var o=orders[i];
h+='<div style="background:#222;padding:10px;border-radius:10px;margin-bottom:8px"><div style="display:flex;justify-content:space-between"><b style="color:orange">'+o.id+' - '+o.name+' - Rs'+o.total+'</b><button onclick="delOrder(\''+o.id+'\')" style="background:#ff4444;color:#fff;padding:4px 8px;border-radius:6px">Delete</button></div><div style="font-size:11px;color:#aaa;margin-top:6px">'+o.items+'<br>'+o.addr+'<br>📍 '+o.lat+'<br><a href="'+o.map+'" target="_blank" style="color:#25D366">View Location</a><br>'+o.time+'</div></div>';
}
document.getElementById('adminOrders').innerHTML=h||'No orders';
}

function delOrder(id){
if(!confirm('Delete?'))return;
var a=[];
for(var i=0;i<orders.length;i++) if(orders[i].id!=id) a.push(orders[i]);
orders=a;
localStorage.setItem('orders',JSON.stringify(orders));
renderAdmin();
}

document.getElementById('logoBtn').addEventListener('click',function(){
var now=Date.now();
if(now-last>2000) taps=0;
taps++;
last=now;
if(taps>=3){
var p=prompt('Admin Password?');
if(p=='5060'){document.getElementById('admin').classList.add('open');renderAdmin();taps=0;}
else if(p){alert('Wrong');taps=0;}
}
});

function closeAdmin(){document.getElementById('admin').classList.remove('open');}

render();
renderAdmin();
</script>
</body>
</html>
