<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Bake Super Hub | Nagina Premium</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        :root { --p: #FFA500; --bg: #050505; --glass: rgba(255, 255, 255, 0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: #fff; overflow-x: hidden; }

        /* Cinematic Video Background */
        .hero-video-container {
            position: relative;
            width: 100%;
            height: 80vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.6;
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), var(--bg));
        }
        .hero-content { position: relative; z-index: 10; padding: 20px; }
        .hero-content h1 { font-size: 50px; font-weight: 900; line-height: 1; text-transform: uppercase; letter-spacing: -2px; }
        .hero-content p { color: var(--p); font-weight: 600; font-size: 18px; margin-top: 10px; }

        /* Navbar Glass */
        .nav { position: fixed; top: 0; width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; backdrop-filter: blur(15px); background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-weight: 900; font-size: 22px; color: var(--p); letter-spacing: -1px; }

        /* Glass Cards */
        .container { padding: 20px; position: relative; z-index: 20; margin-top: -50px; }
        .section-title { font-size: 24px; font-weight: 800; margin-bottom: 20px; padding-left: 10px; border-left: 4px solid var(--p); }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 25px; }
        .card { 
            background: var(--glass); 
            backdrop-filter: blur(10px); 
            border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.1); 
            overflow: hidden; 
            transition: 0.4s;
        }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .card-body { padding: 20px; }
        .card-body h3 { font-size: 20px; font-weight: 700; }
        
        .price-tag { color: var(--p); font-size: 24px; font-weight: 900; }
        .add-btn { 
            background: var(--p); color: #000; border: none; padding: 12px 25px; 
            border-radius: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(255,165,0,0.3);
        }

        /* Floating Cart */
        .floating-cart { 
            position: fixed; bottom: 30px; left: 20px; right: 20px; 
            background: var(--p); color: #000; padding: 18px; border-radius: 20px;
            display: none; justify-content: space-between; align-items: center;
            font-weight: 800; z-index: 1000; box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp { from { transform: translateY(100px); } to { transform: translateY(0); } }

        /* Drawer System */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; z-index: 2000; }
        .drawer { 
            position: fixed; bottom: 0; left: 0; right: 0; background: #111; 
            border-radius: 40px 40px 0 0; padding: 30px 25px; z-index: 2100;
            transform: translateY(100%); transition: 0.5s; max-height: 90vh; overflow-y: auto;
        }
        .drawer.open { transform: translateY(0); }

        input, textarea { 
            width: 100%; background: #1a1a1a; border: 1px solid #333; 
            padding: 18px; border-radius: 20px; color: #fff; margin-bottom: 15px; outline: none; 
        }

        /* Admin Tag */
        .admin-login { font-size: 11px; opacity: 0.5; padding: 10px; text-align: center; }

    </style>
</head>
<body>

    <nav class="nav">
        <div class="logo">BAKE SUPER HUB</div>
        <div style="font-size: 12px; background: rgba(255,165,0,0.2); color: var(--p); padding: 5px 12px; border-radius: 20px; font-weight: 800;">FSSAI REGISTERED</div>
    </nav>

    <!-- Hero Video Section -->
    <div class="hero-video-container">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-fresh-flame-grilled-burger-34504-large.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <p>EST. 2024 • NAGINA</p>
            <h1>Freshly <br><span style="color: var(--p);">Crafted</span></h1>
            <p style="color: #fff; opacity: 0.8; font-size: 14px;">The Taste of Perfection in Every Bite</p>
        </div>
    </div>

    <!-- Main Menu -->
    <div class="container">
        <h2 class="section-title">Chef's Special Menu</h2>
        <div class="grid" id="product-list">
            <!-- Loading from JS -->
        </div>
        
        <div class="admin-login" onclick="openAdmin()">Owner Login (Admin Panel)</div>
    </div>

    <!-- Floating Order Bar -->
    <div class="floating-cart" id="cart-bar" onclick="openCheckout()">
        <span id="cart-info">1 Item | ₹39</span>
        <span>PROCEED TO ORDER ➔</span>
    </div>

    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <!-- Checkout Drawer -->
    <div class="drawer" id="checkout-drawer">
        <h2 style="margin-bottom: 10px;">Complete Your <span style="color: var(--p);">Order</span></h2>
        <p style="font-size: 13px; color: #888; margin-bottom: 20px;">Cash on Delivery Available in Nagina</p>
        
        <div id="order-summary" style="margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px;"></div>

        <input type="text" id="c-name" placeholder="Full Name">
        <input type="tel" id="c-phone" placeholder="Mobile Number">
        <textarea id="c-addr" placeholder="Delivery Address (Nagina 0-5km)"></textarea>

        <button class="add-btn" style="width: 100%; height: 60px; font-size: 18px;" onclick="saveOrder()">CONFIRM WEBSITE ORDER</button>
    </div>

    <!-- Admin Drawer -->
    <div class="drawer" id="admin-drawer">
        <h2 style="color: var(--p); margin-bottom: 20px;">Live Website Orders</h2>
        <div id="admin-list"></div>
        <button class="add-btn" style="background: #333; color: #fff; margin-top: 20px;" onclick="closeAll()">Close Panel</button>
    </div>

    <script>
        const PRODUCTS = [
            { id: 1, name: "Special Veg Burger", price: 39, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600" },
            { id: 2, name: "Cheese Lava Burger", price: 49, img: "https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=600" },
            { id: 3, name: "Veg Cheese Pizza (7\")", price: 120, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600" },
            { id: 4, name: "Tandoori Paneer Pizza", price: 149, img: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600" }
        ];

        let cart = [];

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = PRODUCTS.map(p => `
                <div class="card">
                    <img src="${p.img}" loading="lazy">
                    <div class="card-body">
                        <h3>${p.name}</h3>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
                            <span class="price-tag">₹${p.price}</span>
                            <button class="add-btn" onclick="addToCart(${p.id})">Add +</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = PRODUCTS.find(p => p.id === id);
            cart.push(product);
            
            const sub = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('cart-bar').style.display = 'flex';
            document.getElementById('cart-info').innerText = `${cart.length} Item | ₹${sub}`;
        }

        function openCheckout() {
            document.getElementById('overlay').style.display = 'block';
            const dr = document.getElementById('checkout-drawer');
            dr.classList.add('open');
            
            const sub = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('order-summary').innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <span>Items:</span><b>${cart.length}</b>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:5px;">
                    <span>Bill Amount:</span><b style="color:var(--p)">₹${sub}</b>
                </div>
            `;
        }

        function saveOrder() {
            const name = document.getElementById('c-name').value;
            const phone = document.getElementById('c-phone').value;
            const addr = document.getElementById('c-addr').value;

            if(!name || !phone || !addr) { alert("Details fill karein!"); return; }

            const order = {
                id: "#BSH" + Math.floor(Math.random()*9000+1000),
                name, phone, addr,
                items: cart.map(i => i.name).join(", "),
                total: cart.reduce((s, i) => s + i.price, 0),
                time: new Date().toLocaleTimeString()
            };

            let orders = JSON.parse(localStorage.getItem('bsh_orders') || '[]');
            orders.push(order);
            localStorage.setItem('bsh_orders', JSON.stringify(orders));

            alert("✅ Order Confirmed on Website!");
            window.open(`https://wa.me/919106557703?text=New Website Order: ${order.id}`);
            
            cart = [];
            closeAll();
            document.getElementById('cart-bar').style.display = 'none';
        }

        function openAdmin() {
            const pin = prompt("Enter Admin PIN:");
            if(pin === "2026") {
                document.getElementById('overlay').style.display = 'block';
                document.getElementById('admin-drawer').classList.add('open');
                
                const list = document.getElementById('admin-list');
                let orders = JSON.parse(localStorage.getItem('bsh_orders') || '[]');
                
                if(orders.length === 0) {
                    list.innerHTML = "<p>No orders yet.</p>";
                } else {
                    list.innerHTML = orders.reverse().map(o => `
                        <div style="background:#222; padding:15px; border-radius:20px; margin-bottom:10px; border-left:4px solid var(--p)">
                            <b>${o.id}</b> - ₹${o.total}<br>
                            <small>${o.name} | ${o.phone}</small><br>
                            <p style="font-size:12px; color:#aaa;">${o.items}</p>
                            <p style="font-size:11px; margin-top:5px;">📍 ${o.addr}</p>
                        </div>
                    `).join('');
                }
            }
        }

        function closeAll() {
            document.getElementById('overlay').style.display = 'none';
            document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open'));
        }

        window.onload = renderProducts;
    </script>
</body>
</html>
