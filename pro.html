<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BakeSuperHub | Professional Food Delivery</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        /* Hero Section with Video Background */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.6); /* Video ko thoda dark kiya taki text saaf dikhe */
        }

        /* Navbar */
        nav {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #ff4d4d;
        }

        /* Search Section (Zomato Style) */
        .hero-content h1 {
            font-size: 55px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .search-container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px); /* Glass effect */
            padding: 10px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            width: 80%;
            max-width: 800px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .search-container input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 15px 20px;
            font-size: 16px;
            flex: 1;
        }

        .search-container input::placeholder {
            color: #ddd;
        }

        .search-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .search-btn:hover {
            background: #e60000;
            transform: scale(1.05);
        }

        /* Features Section */
        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 30px;
            border-radius: 20px;
            width: 250px;
            transition: 0.4s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
        }

        .feature-card i {
            font-size: 40px;
            margin-bottom: 15px;
            color: #ff4d4d;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .hero-content h1 { font-size: 32px; }
            .search-container { flex-direction: column; border-radius: 20px; width: 90%; }
            .search-container input { width: 100%; text-align: center; }
            .search-btn { width: 100%; }
            nav { padding: 20px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">BAKE<span style="color:#ff4d4d">SUPER</span>HUB</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">Orders</a>
            <a href="#"><i class="fas fa-user-circle"></i> Login</a>
        </div>
    </nav>

    <section class="hero">
        <!-- Background Video -->
        <video autoplay muted loop playsinline id="bg-video">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-delicious-cheeseburger-falling-into-place-41315-large.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>

        <div class="hero-content">
            <h1>Discover Best Food & Drinks</h1>
            <p style="margin-bottom: 30px; font-size: 18px; opacity: 0.9;">Professional quality, delivered to your doorstep.</p>
            
            <div class="search-container">
                <i class="fas fa-map-marker-alt" style="margin-left:20px; color:#ff4d4d;"></i>
                <input type="text" placeholder="Your Location...">
                <div style="width: 1px; height: 30px; background: rgba(255,255,255,0.3); margin: 0 10px;"></div>
                <input type="text" placeholder="Search for burger, pizza or cakes...">
                <button class="search-btn">Search</button>
            </div>

            <div class="features">
                <div class="feature-card">
                    <i class="fas fa-motorcycle"></i>
                    <h3>Fast Delivery</h3>
                    <p>Under 30 mins</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-utensils"></i>
                    <h3>Top Rated</h3>
                    <p>Best local chefs</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-percentage"></i>
                    <h3>Big Offers</h3>
                    <p>Up to 50% Off</p>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
